<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f">
<meta name="description" content="A OneQR business page with customer actions and contact information."><title>Business page — OneQR</title>
<style>
:root{--ink:#142820;--muted:#63746a;--paper:#f5f8f2;--green:#b8f36b;--dark:#10251f;--line:#e1e8dd;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(540px,calc(100% - 28px));margin:0 auto}.header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:10px}.brand{display:flex;align-items:center;gap:8px;font-weight:950;font-size:19px;letter-spacing:-.06em}.mark{background:var(--green);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:18px}.tag{color:#66894e;background:#edf6e6;border-radius:99px;padding:7px 9px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.main{padding:18px 0 35px}.cover{background:#e5f2dc;border:1px solid #d7e8ce;border-radius:24px;padding:24px 22px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:26px}.category{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:#5c7c4c}.name{font-size:clamp(30px,8vw,42px);line-height:1;letter-spacing:-.075em;font-weight:950;margin:15px 0 8px;overflow-wrap:anywhere}.description{font-size:13px;line-height:1.7;color:#556c4b;white-space:pre-wrap;overflow-wrap:anywhere}.details{display:grid;gap:8px;margin-top:14px}.detail{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;color:#53655a;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.detail-icon{width:22px;flex:none}.sectiontitle{font-size:14px;font-weight:950;letter-spacing:-.03em;margin:24px 2px 11px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{display:flex;align-items:center;gap:12px;min-height:75px;padding:13px;background:white;border:1px solid var(--line);border-radius:16px;text-align:left;transition:transform .15s,border-color .15s;cursor:pointer;font:inherit;width:100%}.action:hover{transform:translateY(-2px);border-color:#a6c997}.action.disabled{opacity:.6;cursor:pointer}.emoji{width:39px;height:39px;flex:none;background:#f0f7e9;border-radius:12px;display:grid;place-items:center;font-size:19px}.action-text{font-size:12px;line-height:1.35;font-weight:900;overflow-wrap:anywhere}.arrow{font-size:16px;margin-left:auto;color:#8b9a8e}.info{margin-top:17px;padding:14px 15px;background:white;border:1px solid var(--line);border-radius:15px;color:var(--muted);font-size:11px;line-height:1.65}.info strong{color:var(--ink)}.footer{padding:19px 0 27px;text-align:center;font-size:10px;color:#829087;line-height:1.7}.footer a{font-weight:900;color:var(--ink)}.empty{margin-top:25px;background:white;border:1px solid var(--line);border-radius:20px;padding:27px;text-align:center}.empty-icon{font-size:31px;margin-bottom:12px}.empty h1{font-size:25px;letter-spacing:-.05em;margin:0 0 10px}.empty p{color:var(--muted);font-size:13px;line-height:1.7}.btn{display:inline-flex;margin-top:10px;background:var(--dark);color:white;border:0;border-radius:99px;padding:12px 17px;font-size:12px;font-weight:900;cursor:pointer}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--dark);color:white;border-radius:14px;padding:13px 16px;max-width:calc(100% - 28px);width:max-content;font-size:12px;line-height:1.55;box-shadow:0 12px 35px #10251f30;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{text-align:center;padding:45px 15px;color:var(--muted);font-size:12px}@media(max-width:390px){.actions{grid-template-columns:1fr}.cover{padding:20px}.name{font-size:33px}}
</style>
</head>
<body><div class="shell"><header class="header"><a class="brand" href="index.html"><span class="mark">▦</span><span>oneqr<span style="color:#78a94c">.</span></span></a><span class="tag">Business page</span></header><main class="main" id="main"><div class="loading">Loading this OneQR business page…</div></main><footer class="footer">A OneQR business page · Not a payment service<br><a href="index.html">Learn about OneQR</a> · <a href="dashboard.html">Merchant sign in</a></footer></div><div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);let timer;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),4200)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function urlOrNull(raw){try{const u=new URL(raw);return ['https:','http:'].includes(u.protocol)?u.href:null}catch(e){return null}}function safePhone(raw){return String(raw||'').replace(/[^+\d]/g,'')}function normalizeWa(raw){return String(raw||'').replace(/\D/g,'')}function fallbackFor(id,p){if(id==='call'&&p.public_phone){const n=safePhone(p.public_phone);return n?'tel:'+n:null}if(id==='whatsapp'){const n=normalizeWa(p.whatsapp||p.public_phone);return n.length>=8?'https://wa.me/'+n:null}if(id==='email'&&p.public_email)return 'mailto:'+p.public_email;if(id==='website'&&p.website_url)return urlOrNull(p.website_url);if(id==='location'&&p.address)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address);return null}function actionHref(a,p){return urlOrNull(a.target||'')||fallbackFor(a.id,p)}function showEmpty(title,detail){const main=$('main');main.innerHTML='';const card=el('section','empty');card.appendChild(el('div','empty-icon','▦'));card.appendChild(el('h1','',title));card.appendChild(el('p','',detail));const link=el('a','btn','Open OneQR home');link.href='index.html';card.appendChild(link);main.appendChild(card)}function appendDetail(box,emoji,label,value,href){if(!value)return;const row=el('div','detail');row.appendChild(el('span','detail-icon',emoji));const txt=el('span','',label+': ');if(href){const link=el('a','',value);link.href=href;if(href.startsWith('http')){link.target='_blank';link.rel='noopener noreferrer'}txt.appendChild(link)}else txt.appendChild(document.createTextNode(value));row.appendChild(txt);box.appendChild(row)}function showProfile(p){document.title=p.business_name+' — OneQR';const main=$('main');main.innerHTML='';const cover=el('section','cover');cover.appendChild(el('div','category',String(p.business_type||'other').replace(/-/g,' ').toUpperCase()+' · CUSTOMER PAGE'));const identity=el('div');identity.appendChild(el('div','name',p.business_name));identity.appendChild(el('div','description',p.tagline||p.description||'Welcome. Choose an action to continue.'));cover.appendChild(identity);main.appendChild(cover);const details=el('div','details');appendDetail(details,'ℹ️','About',p.tagline&&p.description?p.description:'',null);appendDetail(details,'📍','Location',p.address,'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address||''));appendDetail(details,'📞','Phone',p.public_phone,'tel:'+safePhone(p.public_phone));appendDetail(details,'✉️','Email',p.public_email,'mailto:'+p.public_email);appendDetail(details,'🌐','Website',p.website_url,urlOrNull(p.website_url));if(details.children.length)main.appendChild(details);main.appendChild(el('h2','sectiontitle','How can we help?'));const grid=el('div','actions');const actions=Array.isArray(p.actions)?p.actions.slice(0,6):[];actions.forEach(a=>{const href=actionHref(a,p);const node=href?el('a','action'):el('button','action disabled');if(href){node.href=href;if(href.startsWith('http')){node.target='_blank';node.rel='noopener noreferrer'} }else{node.type='button';node.addEventListener('click',()=>toast('This action is not connected yet. Contact '+p.business_name+' directly or ask the business to update its OneQR page.'));}node.appendChild(el('span','emoji',a.emoji||'↗'));node.appendChild(el('span','action-text',a.label||'Open action'));node.appendChild(el('span','arrow','→'));grid.appendChild(node)});main.appendChild(grid);const info=el('div','info');const strong=el('strong','','About this page. ');info.appendChild(strong);info.appendChild(document.createTextNode('This OneQR page displays information the business chose to publish. Orders, bookings, repair records and payments happen only through explicitly configured external services.'));main.appendChild(info)}async function init(){const cfg=window.ONEQR_CONFIG||{};if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR_PROJECT_REF')||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_SUPABASE')){showEmpty('OneQR is not connected yet','The site owner needs to configure Supabase before public merchant pages can load.');return;}if(!window.supabase||typeof window.supabase.createClient!=='function'){showEmpty('Could not load the data service','Refresh the page or check your internet connection.');return;}const slug=(new URLSearchParams(location.search).get('slug')||'').trim().toLowerCase();if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){showEmpty('Business page not found','This link does not contain a valid business page address. Ask the merchant for an updated OneQR link.');return;}const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await sb.from('public_merchants').select('slug,business_name,business_type,tagline,description,public_phone,whatsapp,public_email,website_url,address,actions').eq('slug',slug).maybeSingle();if(error){console.error(error);showEmpty('Could not load this business page','The page data service returned an error. Check the Supabase public view and API key configuration.');return;}if(!data){showEmpty('This business page is not published','The merchant may still be editing this page or the link may be incorrect.');return;}showProfile(data)}init().catch(err=>{console.error(err);showEmpty('Something went wrong','This OneQR page could not be loaded. Please try again.');});})();
</script></body></html>
