<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251f">
<title>Business page — OneQR</title>
<style>
:root{--ink:#142820;--muted:#63746a;--paper:#f5f8f2;--green:#b8f36b;--dark:#10251f;--line:#e1e8dd;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(520px,calc(100% - 28px));margin:0 auto}.header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:10px}.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.06em}.mark{background:var(--green);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:18px}.tag{color:#66894e;background:#edf6e6;border-radius:99px;padding:7px 9px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.main{padding:18px 0 35px}.cover{background:#e5f2dc;border:1px solid #d7e8ce;border-radius:24px;padding:24px 22px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:26px}.category{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#5c7c4c}.name{font-size:clamp(30px,8vw,42px);line-height:1;letter-spacing:-.075em;font-weight:900;margin:15px 0 8px;overflow-wrap:anywhere}.description{font-size:13px;line-height:1.7;color:#556c4b;white-space:pre-wrap;overflow-wrap:anywhere}.details{display:grid;gap:8px;margin-top:14px}.detail{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;color:#53655a;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.detail strong{color:var(--ink)}.sectiontitle{font-size:14px;font-weight:900;letter-spacing:-.03em;margin:24px 2px 11px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{display:flex;align-items:center;gap:12px;min-height:75px;padding:13px;background:white;border:1px solid var(--line);border-radius:16px;text-align:left;transition:transform .15s,border-color .15s;cursor:pointer;font:inherit}.action:hover{transform:translateY(-2px);border-color:#a6c997}.emoji{width:39px;height:39px;flex:none;background:#f0f7e9;border-radius:12px;display:grid;place-items:center;font-size:19px}.action-text{font-size:12px;line-height:1.35;font-weight:850;overflow-wrap:anywhere}.arrow{font-size:16px;margin-left:auto;color:#8b9a8e}.info{margin-top:17px;padding:14px 15px;background:white;border:1px solid var(--line);border-radius:15px;color:var(--muted);font-size:11px;line-height:1.65}.info strong{color:var(--ink)}.footer{padding:19px 0 27px;text-align:center;font-size:10px;color:#829087;line-height:1.7}.footer a{font-weight:850;color:var(--ink)}.empty{margin-top:25px;background:white;border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}.empty h1{font-size:25px;letter-spacing:-.05em;margin:0 0 10px}.empty p{color:var(--muted);font-size:13px;line-height:1.7}.btn{display:inline-flex;margin-top:10px;background:var(--dark);color:white;border-radius:99px;padding:12px 17px;font-size:12px;font-weight:850}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--dark);color:white;border-radius:14px;padding:13px 16px;max-width:calc(100% - 28px);width:max-content;font-size:12px;line-height:1.55;box-shadow:0 12px 35px #10251f30;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.actions{grid-template-columns:1fr}.cover{padding:20px}.name{font-size:33px}}
</style>
</head>
<body><div class="shell"><header class="header"><a class="brand" href="index.html"><span class="mark">▦</span><span>oneqr<span style="color:#78a94c">.</span></span></a><span class="tag">Business page</span></header><main class="main" id="main"><div class="empty"><h1>OneQR business page</h1><p>This page needs a profile link generated from the Merchant Setup dashboard. Open the dashboard, create a profile and scan its QR code again.</p><a class="btn" href="dashboard.html">Open merchant setup ↗</a></div></main><footer class="footer">A OneQR prototype · Not a payment service<br><a href="index.html">Learn about OneQR</a></footer></div><div class="toast" id="toast" role="status"></div>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);let timer;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),4500)}function decodeProfile(){let raw=location.hash.replace(/^#p=/,'');if(!raw||raw===location.hash)return null;raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';const packed=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!packed||packed.v!==1)return null;const profile=packed.n?{v:packed.v,name:packed.n,type:packed.t||'other',tagline:packed.g||'',description:packed.d||'',phone:packed.p||'',whatsapp:packed.w||'',email:packed.e||'',website:packed.s||'',address:packed.a||'',actions:Array.isArray(packed.x)?packed.x.map(a=>({id:a[0],label:a[1],emoji:a[2],target:a[3]||''})):[]}:packed;if(typeof profile.name!=='string'||!Array.isArray(profile.actions))return null;return profile}function safeUrl(url){try{const u=new URL(url);return ['http:','https:','mailto:','tel:'].includes(u.protocol)?u.href:null}catch(e){return null}}function fallbackFor(id,p){if(id==='call'&&p.phone)return 'tel:'+p.phone.replace(/[^+\d]/g,'');if(id==='whatsapp'){const num=(p.whatsapp||p.phone||'').replace(/\D/g,'');if(num.length>=8)return 'https://wa.me/'+num}if(id==='email'&&p.email)return 'mailto:'+p.email;if(id==='website'&&p.website)return safeUrl(p.website);if(id==='location'&&p.address)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address);if(id==='reviews'&&p.website)return safeUrl(p.website);return null}function actionHref(a,p){return safeUrl(a.target||'')||fallbackFor(a.id,p)}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function showProfile(p){document.title=p.name+' — OneQR';const main=$('main');main.innerHTML='';const cover=el('section','cover');cover.appendChild(el('div','category',String(p.type||'business').replace(/-/g,' ').toUpperCase()+' · CUSTOMER PAGE'));const titleBlock=el('div');titleBlock.appendChild(el('div','name',p.name));const desc=el('div','description',p.tagline||p.description||'Welcome. Choose an action to continue.');titleBlock.appendChild(desc);cover.appendChild(titleBlock);main.appendChild(cover);const details=[];if(p.description&&p.tagline)details.push(['ℹ️',p.description]);if(p.address)details.push(['📍',p.address]);if(p.phone)details.push(['📞',p.phone]);if(p.email)details.push(['✉️',p.email]);if(p.website)details.push(['🌐',p.website]);if(details.length){const box=el('div','details');details.forEach(([emoji,txt])=>{const row=el('div','detail');row.appendChild(el('span','',emoji));const val=el('span','',txt);if(txt===p.website){val.innerHTML='';const link=el('a','',txt);link.href=safeUrl(p.website)||'#';link.target='_blank';link.rel='noreferrer';val.appendChild(link)}row.appendChild(val);box.appendChild(row)});main.appendChild(box)}main.appendChild(el('h2','sectiontitle','How can we help?'));const grid=el('div','actions');(p.actions||[]).slice(0,6).forEach(a=>{const link=actionHref(a,p);const node=link?el('a','action'):el('button','action');node.appendChild(el('span','emoji',a.emoji||'↗'));node.appendChild(el('span','action-text',a.label||'Open action'));node.appendChild(el('span','arrow','→'));if(link){node.href=link;if(/^https?:/.test(link)||/^mailto:/.test(link)||/^tel:/.test(link)){node.target='_blank';node.rel='noreferrer'}if(/^tel:|^mailto:/.test(link))node.removeAttribute('target')}else{node.type='button';node.addEventListener('click',()=>{const msg='This action has no destination configured yet. Contact '+p.name+' directly, or ask the business to update this OneQR page.';toast(msg)})}grid.appendChild(node)});main.appendChild(grid);const info=el('div','info');const strong=el('strong','', 'Prototype notice. ');info.appendChild(strong);info.appendChild(document.createTextNode('This page was created with OneQR demo tools. Bookings, orders, estimates, receipts, warranties and payments are not processed by OneQR unless a specific destination is configured by the business. Never share private customer information through this demo.'));main.appendChild(info)}try{const p=decodeProfile();if(p)showProfile(p)}catch(e){console.warn('Invalid OneQR profile link',e);toast('This OneQR link could not be read. Recreate the QR from Merchant Setup.')}})();
</script></body></html>
