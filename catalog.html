<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251f"><meta name="description" content="Browse products and services listed by a local business on OneQR.">
<title>Catalogue — OneQR</title>
<style>
:root{--ink:#142820;--muted:#66766c;--paper:#f5f8f2;--white:#fff;--green:#b8f36b;--dark:#10251f;--line:#e0e7dd;--radius:22px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(760px,calc(100% - 28px));margin:auto}.header{height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-weight:950;font-size:20px;letter-spacing:-.06em}.mark{background:var(--green);width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-size:18px}.tag{color:#66894e;background:#edf6e6;border-radius:99px;padding:7px 10px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero{margin:20px 0 18px;background:#e5f2dc;border:1px solid #d7e8ce;border-radius:24px;padding:26px 23px;min-height:165px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:#5b7c4b}.name{font-size:clamp(30px,7vw,42px);line-height:1;letter-spacing:-.075em;font-weight:950;margin:11px 0 7px;overflow-wrap:anywhere}.subtitle{font-size:13px;line-height:1.7;color:#556c4b;white-space:pre-wrap;overflow-wrap:anywhere}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 2px 12px}.headrow h2{font-size:17px;letter-spacing:-.04em;margin:0}.count{border-radius:999px;padding:6px 9px;background:#eff3eb;font-size:10px;font-weight:900;color:#607064;white-space:nowrap}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.filter{border:1px solid var(--line);background:white;color:var(--muted);border-radius:999px;padding:9px 13px;font-size:11px;font-weight:850;cursor:pointer}.filter.active{background:var(--dark);border-color:var(--dark);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.image{aspect-ratio:4/3;background:#edf4e8;display:grid;place-items:center;color:#76975e;font-size:36px;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover}.itembody{padding:14px}.type{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:#66894e}.itemname{font-size:15px;font-weight:950;letter-spacing:-.03em;margin:7px 0;overflow-wrap:anywhere}.desc{font-size:11px;line-height:1.65;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;min-height:0}.price{font-size:13px;font-weight:950;margin-top:12px}.empty{background:white;border:1px solid var(--line);border-radius:17px;padding:28px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}.loading{padding:42px 12px;text-align:center;color:var(--muted);font-size:12px}.contact{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:12px 16px;background:var(--dark);color:white;font-size:11px;font-weight:900}.btn.primary{background:var(--green);color:var(--dark)}.info{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;color:var(--muted);font-size:10px;line-height:1.7;margin:20px 0}.info strong{color:var(--ink)}.footer{padding:18px 0 26px;text-align:center;font-size:10px;line-height:1.8;color:#829087}.footer a{font-weight:900;color:var(--ink)}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--dark);color:white;border-radius:13px;padding:12px 15px;max-width:calc(100% - 24px);width:max-content;font-size:12px;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:490px){.grid{grid-template-columns:1fr 1fr;gap:8px}.itembody{padding:10px}.itemname{font-size:13px}.desc{font-size:10px}.price{font-size:12px}.hero{padding:23px 19px}.image{aspect-ratio:1/1}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell"><header class="header"><a class="brand" href="index.html"><span class="mark">▦</span><span>oneqr<span style="color:#78a94c">.</span></span></a><span class="tag">Public catalogue</span></header><main id="main"><div class="loading">Loading catalogue…</div></main><footer class="footer">A OneQR business catalogue · Product listings only; no checkout or payment processing<br><a href="merchant.html">Business page</a> · <a href="index.html">About OneQR</a></footer></div><div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id);let activeFilter='all',allItems=[],timer;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),3500)}function urlOrNull(raw){try{const u=new URL(raw);return u.protocol==='https:'?u.href:null}catch(e){return null}}function safePhone(raw){return String(raw||'').replace(/[^+\d]/g,'')}function waHref(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('0'))n='94'+n.slice(1);return n.length>=8?'https://wa.me/'+n:null}function money(price,currency){if(price===null||price===undefined||price==='')return 'Price not listed';const n=Number(price);if(!Number.isFinite(n))return 'Price not listed';try{return new Intl.NumberFormat('en-LK',{style:'currency',currency:currency||'LKR',maximumFractionDigits:2}).format(n)}catch(e){return (currency||'LKR')+' '+n.toFixed(2)}}
function showEmpty(title,detail){const main=$('main');main.replaceChildren();const empty=el('section','empty');empty.append(el('strong','',title),el('p','',detail));main.appendChild(empty)}
function renderItems(){const host=$('itemsGrid');host.replaceChildren();const shown=allItems.filter(i=>activeFilter==='all'||i.item_type===activeFilter);$('visibleCount').textContent=shown.length+' '+(shown.length===1?'item':'items');if(!shown.length){const empty=el('div','empty');empty.append(el('strong','',activeFilter==='all'?'No items listed yet':'No '+(activeFilter==='product'?'products':'services')+' listed yet'),el('span','',activeFilter==='all'?'This business has not published any available catalogue items yet. Please check back later.':'Try the other catalogue filter.'));host.appendChild(empty);return;}shown.forEach(item=>{const card=el('article','item');const image=el('div','image');if(item.image_url){const img=document.createElement('img');img.src=item.image_url;img.alt=item.name;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{image.replaceChildren();image.textContent=item.item_type==='service'?'✦':'▦'};image.appendChild(img)}else image.textContent=item.item_type==='service'?'✦':'▦';const body=el('div','itembody');body.appendChild(el('div','type',item.item_type==='service'?'Service':'Product'));body.appendChild(el('div','itemname',item.name));if(item.description)body.appendChild(el('div','desc',item.description));body.appendChild(el('div','price',money(item.price,item.currency)));card.append(image,body);host.appendChild(card)});}
function showCatalog(merchant,items){const main=$('main');main.replaceChildren();document.title=merchant.business_name+' catalogue — OneQR';const hero=el('section','hero');hero.appendChild(el('div','eyebrow',String(merchant.business_type||'local business').replace(/-/g,' ').toUpperCase()+' · CATALOGUE'));const identity=el('div');identity.appendChild(el('div','name',merchant.business_name));identity.appendChild(el('div','subtitle',merchant.tagline||'Browse the products and services listed by this business.'));hero.appendChild(identity);main.appendChild(hero);const row=el('div','headrow');row.append(el('h2','','Products & services'),el('span','count','0 items'));row.lastChild.id='visibleCount';main.appendChild(row);const filters=el('div','filters');[['all','All items'],['product','Products'],['service','Services']].forEach(([value,label])=>{const b=el('button','filter'+(value==='all'?' active':''),label);b.type='button';b.addEventListener('click',()=>{activeFilter=value;filters.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderItems()});filters.appendChild(b)});main.appendChild(filters);const grid=el('section','grid');grid.id='itemsGrid';main.appendChild(grid);allItems=items;renderItems();const contact=el('div','contact');if(merchant.public_phone){const a=el('a','btn','Call business');a.href='tel:'+safePhone(merchant.public_phone);contact.appendChild(a)}const whatsapp=waHref(merchant.whatsapp||merchant.public_phone);if(whatsapp){const a=el('a','btn primary','WhatsApp business');a.href=whatsapp;a.target='_blank';a.rel='noopener noreferrer';contact.appendChild(a)}if(contact.children.length){const label=el('h2','headrow','Contact this business');main.append(label,contact)}const info=el('div','info');info.appendChild(el('strong','','About this catalogue. '));info.appendChild(document.createTextNode('Items shown here were published by the business. This page does not accept orders or payments. Contact the business directly to confirm current availability and price.'));main.appendChild(info)}
async function init(){const cfg=window.ONEQR_CONFIG||{};if(!cfg.supabaseUrl||String(cfg.supabaseUrl).includes('YOUR_PROJECT_REF')||!cfg.supabaseAnonKey||String(cfg.supabaseAnonKey).includes('YOUR_SUPABASE')){showEmpty('OneQR is not connected yet','The website owner must configure the Supabase URL and publishable/anon key.');return}if(!window.supabase||typeof window.supabase.createClient!=='function'){showEmpty('Could not load the catalogue service','Check your internet connection and refresh the page.');return}const slug=(new URLSearchParams(location.search).get('slug')||'').trim().toLowerCase();if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){showEmpty('Catalogue not found','This link does not contain a valid business page address.');return}const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const result=await sb.from('public_merchants').select('slug,business_name,business_type,tagline,public_phone,whatsapp').eq('slug',slug).maybeSingle();if(result.error){console.error(result.error);showEmpty('Could not load this business','The public business view returned an error. Check your Supabase configuration.');return}if(!result.data){showEmpty('This business page is not published','The business may still be a draft, or the link may be incorrect.');return}const products=await sb.from('public_catalog_items').select('merchant_slug,item_type,name,description,price,currency,image_url,display_order,item_id').eq('merchant_slug',slug).order('display_order',{ascending:true});if(products.error){console.error(products.error);showEmpty('Catalogue database setup required','Run stage4_catalog.sql in your Supabase SQL Editor after the Stage 3 schema, then refresh this page.');return}showCatalog(result.data,products.data||[])}init().catch(err=>{console.error(err);showEmpty('Something went wrong','The catalogue could not be loaded. Please refresh and try again. '+(err.message||''))});
})();
</script></body></html>
