<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#10251f">
<meta name="description" content="Browse a local business catalogue and send a product or service request through WhatsApp with OneQR.">
<title>Catalogue & order request — OneQR</title>
<style>
:root{--ink:#142820;--muted:#66766c;--paper:#f5f8f2;--white:#fff;--green:#b8f36b;--dark:#10251f;--line:#e0e7dd;--red:#a03d2f;--radius:22px;--shadow:0 12px 35px rgba(16,37,31,.09)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75a94f;outline-offset:2px}.shell{width:min(900px,calc(100% - 28px));margin:auto}.header{min-height:65px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;font-weight:950;font-size:20px;letter-spacing:-.06em}.mark{background:var(--green);width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-size:18px}.tag{color:#66894e;background:#edf6e6;border-radius:99px;padding:7px 10px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero{margin:20px 0 18px;background:#e5f2dc;border:1px solid #d7e8ce;border-radius:24px;padding:26px 23px;min-height:155px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:#5b7c4b}.name{font-size:clamp(30px,7vw,42px);line-height:1;letter-spacing:-.075em;font-weight:950;margin:11px 0 7px;overflow-wrap:anywhere}.subtitle{font-size:13px;line-height:1.7;color:#556c4b;white-space:pre-wrap;overflow-wrap:anywhere}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 2px 12px}.headrow h2{font-size:18px;letter-spacing:-.04em;margin:0}.count{border-radius:999px;padding:6px 9px;background:#eff3eb;font-size:10px;font-weight:900;color:#607064;white-space:nowrap}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.filter{border:1px solid var(--line);background:white;color:var(--muted);border-radius:999px;padding:9px 13px;font-size:11px;font-weight:850;cursor:pointer}.filter.active{background:var(--dark);border-color:var(--dark);color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.item{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.image{aspect-ratio:4/3;background:#edf4e8;display:grid;place-items:center;color:#76975e;font-size:36px;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover}.itembody{padding:14px;display:flex;flex-direction:column;align-items:stretch;flex:1}.type{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:#66894e}.itemname{font-size:15px;font-weight:950;letter-spacing:-.03em;margin:7px 0;overflow-wrap:anywhere}.desc{font-size:11px;line-height:1.65;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;flex:1}.price{font-size:13px;font-weight:950;margin:12px 0}.add-btn{width:100%;border:0;border-radius:12px;padding:11px 12px;background:var(--dark);color:white;font-size:11px;font-weight:900;display:flex;justify-content:center;gap:7px;align-items:center}.add-btn:hover{background:#24483b}.add-btn:disabled{opacity:.48;cursor:not-allowed;background:#7c8880}.stockline{font-size:10px;font-weight:850;color:#527946;margin-top:8px}.stockline.out{color:#a33a34}.empty{background:white;border:1px solid var(--line);border-radius:17px;padding:28px 22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}.loading{padding:42px 12px;text-align:center;color:var(--muted);font-size:12px}.contact{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:12px 16px;background:var(--dark);color:white;font-size:11px;font-weight:900}.btn.primary{background:var(--green);color:var(--dark)}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.info{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;color:var(--muted);font-size:10px;line-height:1.7;margin:20px 0}.info strong{color:var(--ink)}.footer{padding:18px 0 26px;text-align:center;font-size:10px;line-height:1.8;color:#829087}.footer a{font-weight:900;color:var(--ink)}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--dark);color:white;border-radius:13px;padding:12px 15px;max-width:calc(100% - 24px);width:max-content;font-size:12px;z-index:20;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.cart-dock{position:fixed;z-index:10;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;justify-content:center;backdrop-filter:blur(12px)}.cart-dock[hidden]{display:none}.dock-inner{width:min(900px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px}.dock-title{font-size:12px;font-weight:950}.dock-sub{font-size:10px;color:var(--muted);margin-top:3px}.dock-button{border:0;border-radius:999px;background:var(--green);color:var(--dark);padding:12px 17px;font-size:11px;font-weight:950;white-space:nowrap}.order-panel{margin:24px 0 16px;background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.order-panel[hidden]{display:none}.order-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.order-header h2{font-size:22px;letter-spacing:-.05em;margin:0 0 6px}.muted{color:var(--muted);font-size:11px;line-height:1.65}.cart-lines{display:grid;gap:9px;margin:17px 0}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}.line-name{font-size:12px;font-weight:900;overflow-wrap:anywhere}.line-meta{font-size:10px;color:var(--muted);margin-top:4px}.line-controls{display:flex;align-items:center;gap:7px}.qty-btn,.remove-btn{border:1px solid var(--line);background:#f8faf6;border-radius:9px;min-width:30px;min-height:30px;font-weight:900;color:var(--ink)}.remove-btn{color:var(--red);font-size:10px;padding:5px 8px}.totals{padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:6px}.total-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:850}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.consent{display:flex;align-items:flex-start;gap:9px;font-size:11px;line-height:1.6;color:var(--muted);font-weight:700}.consent input{width:16px!important;min-width:16px;margin:2px 0 0;accent-color:#315e36}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:900}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #d6e0d4;background:#fbfcfa;border-radius:11px;padding:11px 12px;color:var(--ink);font-size:12px}.field textarea{resize:vertical;min-height:80px}.submit-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.fineprint{font-size:10px;line-height:1.7;color:var(--muted);margin:13px 0 0}.status{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}.hidden{display:none!important}
@media(max-width:690px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.itembody{padding:12px}.itemname{font-size:14px}}@media(max-width:420px){.shell{width:calc(100% - 22px)}.grid{gap:8px}.itembody{padding:10px}.itemname{font-size:13px}.desc{font-size:10px}.price{font-size:12px}.add-btn{padding:10px 7px;font-size:10px}.hero{padding:22px 18px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.order-panel{padding:15px}.dock-button{padding:11px 13px}.dock-title{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
  <header class="header"><a class="brand" href="index.html"><span class="mark">▦</span><span>oneqr<span style="color:#78a94c">.</span></span></a><span class="tag">Catalogue & requests</span></header>
  <main id="main"><div class="loading">Loading catalogue…</div></main>
  <footer class="footer">OneQR catalogue · Stock is deducted only when the merchant confirms a request<br><a id="businessPageLink" href="merchant.html">Business page</a> · <a href="index.html">About OneQR</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="cart-dock" id="cartDock" hidden><div class="dock-inner"><div><div class="dock-title" id="dockTitle">Your request</div><div class="dock-sub" id="dockSub">0 items selected</div></div><button class="dock-button" id="reviewCartBtn" type="button">Review request →</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let activeFilter='all',allItems=[],merchantData=null,client=null,timer=null,lastSubmittedOrder=null,submitting=false;
const cart=new Map();
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),3400)}
function safeHttps(raw){try{const u=new URL(raw);return u.protocol==='https:'?u.href:null}catch(e){return null}}
function safePhone(raw){return String(raw||'').replace(/[^+\d]/g,'')}
function normalizeWhatsApp(raw){let n=String(raw||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='94'+n.slice(1);return n.length>=8?n:null}
function waHref(raw,text=''){const n=normalizeWhatsApp(raw);return n?'https://wa.me/'+n+(text?'?text='+encodeURIComponent(text):''):null}
function money(price,currency){if(price===null||price===undefined||price==='')return 'Price to confirm';const n=Number(price);if(!Number.isFinite(n))return 'Price to confirm';try{return new Intl.NumberFormat('en-LK',{style:'currency',currency:currency||'LKR',maximumFractionDigits:2}).format(n)}catch(e){return (currency||'LKR')+' '+n.toFixed(2)}}
function itemPriceText(item){return item.price===null||item.price===undefined||item.price===''?'Price to confirm':money(item.price,item.currency)}
function cartQuantity(){let n=0;cart.forEach(q=>n+=q);return n}
function cartItemRows(){return Array.from(cart.entries()).map(([id,qty])=>({item:allItems.find(x=>String(x.item_id)===String(id)),qty})).filter(x=>x.item)}
function getSubtotals(rows){const totals=new Map();rows.forEach(({item,qty})=>{if(item.price===null||item.price===undefined||item.price==='')return;const n=Number(item.price);if(!Number.isFinite(n)||n<0)return;const code=String(item.currency||'LKR').toUpperCase();totals.set(code,(totals.get(code)||0)+n*qty)});return totals}
function showEmpty(title,detail){const main=$('main');main.replaceChildren();const empty=el('section','empty');empty.append(el('strong','',title),el('p','',detail));main.appendChild(empty)}
function selectableLimit(item){if(!item.stock_tracking_enabled)return 99;const n=Number(item.stock_quantity);return Number.isFinite(n)?Math.max(0,Math.min(99,Math.floor(n))):0}
function addToCart(item){const id=String(item.item_id),current=cart.get(id)||0,limit=selectableLimit(item);if(current>=limit){toast(limit===0?'This item is out of stock.':'Only '+limit+' unit(s) are available for this item.');return;}cart.set(id,Math.min(limit,current+1));updateDock();renderItems();toast(item.item_type==='service'?'Service added to your request.':'Added to your request.')}
function renderItems(){const host=$('itemsGrid');if(!host)return;host.replaceChildren();const shown=allItems.filter(i=>activeFilter==='all'||i.item_type===activeFilter);$('visibleCount').textContent=shown.length+' '+(shown.length===1?'item':'items');if(!shown.length){const empty=el('div','empty');empty.append(el('strong','',activeFilter==='all'?'No items listed yet':'No '+(activeFilter==='product'?'products':'services')+' listed yet'),el('span','',activeFilter==='all'?'This business has not published any available catalogue items yet. Please check back later.':'Try the other catalogue filter.'));host.appendChild(empty);return;}shown.forEach(item=>{const card=el('article','item');const image=el('div','image');const imageUrl=safeHttps(item.image_url||'');if(imageUrl){const img=document.createElement('img');img.src=imageUrl;img.alt=item.name;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{image.replaceChildren();image.textContent=item.item_type==='service'?'✦':'▦'};image.appendChild(img)}else image.textContent=item.item_type==='service'?'✦':'▦';const body=el('div','itembody');body.appendChild(el('div','type',item.item_type==='service'?'Service':'Product'));body.appendChild(el('div','itemname',item.name));if(item.description)body.appendChild(el('div','desc',item.description));body.appendChild(el('div','price',itemPriceText(item)));if(item.stock_tracking_enabled){const available=selectableLimit(item);body.appendChild(el('div','stockline'+(available===0?' out':''),available===0?'Out of stock':'In stock · '+available+' available'));}const current=cart.get(String(item.item_id))||0,limit=selectableLimit(item);const btn=el('button','add-btn',item.stock_tracking_enabled&&limit===0?'Out of stock':current>0?'＋ Added · '+current:'＋ '+(item.item_type==='service'?'Request service':'Add to request'));btn.type='button';btn.disabled=!!(item.stock_tracking_enabled&&(limit===0||current>=limit));btn.setAttribute('aria-label',(item.item_type==='service'?'Add service ':'Add product ')+item.name+' to request');btn.addEventListener('click',()=>addToCart(item));body.appendChild(btn);card.append(image,body);host.appendChild(card)});}
function updateDock(){const quantity=cartQuantity();$('cartDock').hidden=quantity===0;$('dockTitle').textContent=quantity===1?'1 item in your request':quantity+' items in your request';const totals=getSubtotals(cartItemRows());$('dockSub').textContent=totals.size?Array.from(totals.entries()).map(([c,n])=>money(n,c)).join(' · ')+' estimated':'Prices to confirm with business';renderCartLines()}
function renderCartLines(){const host=$('cartLines');if(!host)return;host.replaceChildren();const rows=cartItemRows();if(!rows.length){host.appendChild(el('div','empty','Your request is empty. Add a product or service above.'));return;}rows.forEach(({item,qty})=>{const row=el('div','cart-line'),left=el('div'),controls=el('div','line-controls');left.appendChild(el('div','line-name',item.name));const calc=item.price!==null&&item.price!==undefined&&item.price!==''?money(Number(item.price)*qty,item.currency):'Price to confirm';left.appendChild(el('div','line-meta',(item.item_type==='service'?'Service':'Product')+' · '+calc+(item.stock_tracking_enabled?' · '+selectableLimit(item)+' currently available':'')));const minus=el('button','qty-btn','−');minus.type='button';minus.setAttribute('aria-label','Decrease quantity of '+item.name);minus.addEventListener('click',()=>changeQty(item,-1));const val=el('span','',String(qty));val.setAttribute('aria-label','Quantity '+qty);const plus=el('button','qty-btn','+');plus.type='button';plus.disabled=qty>=selectableLimit(item);plus.setAttribute('aria-label','Increase quantity of '+item.name);plus.addEventListener('click',()=>changeQty(item,1));const remove=el('button','remove-btn','Remove');remove.type='button';remove.addEventListener('click',()=>{cart.delete(String(item.item_id));updateDock();renderItems()});controls.append(minus,val,plus,remove);row.append(left,controls);host.appendChild(row)});renderTotals(rows)}
function renderTotals(rows){const host=$('cartTotals');host.replaceChildren();const totals=getSubtotals(rows);if(!totals.size){host.appendChild(el('div','total-row','Estimated subtotal'));host.appendChild(el('div','muted','The business will confirm pricing.'));return;}totals.forEach((n,c)=>{const row=el('div','total-row');row.append(el('span','','Estimated subtotal · '+c),el('span','',money(n,c)));host.appendChild(row)});}
function requestMessage(orderNumber=''){const rows=cartItemRows();if(!rows.length)throw new Error('Add at least one product or service first.');const lines=['Hello '+merchantData.business_name+', I would like to make an order/service request through OneQR.'];if(orderNumber)lines.push('OneQR reference: '+orderNumber);lines.push('');rows.forEach(({item,qty},idx)=>{const type=item.item_type==='service'?'Service':'Product';const unit=itemPriceText(item);const lineTotal=item.price!==null&&item.price!==undefined&&item.price!==''?money(Number(item.price)*qty,item.currency):'price to confirm';lines.push((idx+1)+'. '+type+': '+item.name+' × '+qty+' — '+unit+' each; line estimate: '+lineTotal)});lines.push('');const totals=getSubtotals(rows);if(totals.size){lines.push('Estimated subtotal(s):');totals.forEach((n,c)=>lines.push('• '+money(n,c)))}else lines.push('Please confirm pricing.');const customerName=$('customerName').value.trim();const customerPhone=$('customerPhone').value.trim();const fulfilment=$('fulfilment').value;const note=$('customerNote').value.trim();if(customerName)lines.push('','Customer name: '+customerName);if(customerPhone)lines.push('Contact number: '+customerPhone);lines.push('Fulfilment: '+fulfilment);if(note)lines.push('Note: '+note);lines.push('','Please confirm availability, final prices, and delivery/pickup details. This message is a request, not a confirmed order or payment.');return lines.join('\n')}
function toggleRequestLock(locked){
  ['customerName','customerPhone','fulfilment','customerNote','customerConsent'].forEach(id=>{const field=$(id);if(field)field.disabled=locked;});
  document.querySelectorAll('#itemsGrid .add-btn, #cartLines .qty-btn, #cartLines .remove-btn').forEach(btn=>{btn.disabled=locked;});
}
async function submitOrder(){
  if(submitting||lastSubmittedOrder)return;
  const customerName=$('customerName').value.trim();
  if(customerName.length<2){$('customerName').focus();toast('Enter your name to continue.');return;}
  if(!$('customerConsent').checked){$('customerConsent').focus();toast('Please agree to share your request with the business.');return;}
  const rows=cartItemRows();
  if(!rows.length){toast('Add at least one product or service first.');return;}
  if(!client||!merchantData){toast('The order service is not ready. Refresh the page and try again.');return;}
  submitting=true;$('submitOrderBtn').disabled=true;$('submitOrderBtn').textContent='Submitting…';$('orderStatus').textContent='Saving your request securely…';
  try{
    const {data,error}=await client.rpc('submit_public_order_with_tracking',{
      p_merchant_slug:merchantData.slug,
      p_customer_name:customerName,
      p_customer_phone:$('customerPhone').value.trim(),
      p_fulfilment:$('fulfilment').value.toLowerCase().replace(/\s+/g,'_'),
      p_customer_note:$('customerNote').value.trim(),
      p_items:rows.map(({item,qty})=>({item_id:String(item.item_id),quantity:qty}))
    });
    if(error)throw error;
    const saved=Array.isArray(data)?data[0]:data;
    if(!saved||typeof saved.order_number!=='string'||!saved.order_number)throw new Error('The server did not return an order reference. Check that the Stage 6 and Stage 7 SQL migrations ran successfully.');
    lastSubmittedOrder=saved;
    toggleRequestLock(true);
    $('submitOrderBtn').textContent='Request saved ✓';
    const trackingReady=typeof saved.tracking_token==='string'&&/^[a-f0-9]{64}$/i.test(saved.tracking_token);if(trackingReady){$('trackOrderBtn').href='track.html?token='+encodeURIComponent(saved.tracking_token);$('trackOrderBtn').hidden=false;}else{$('trackOrderBtn').hidden=true;}$('orderStatus').textContent='Request saved. Reference: '+saved.order_number+'. The business can now review it in its OneQR Order Inbox. This is not yet a confirmed order.'+(saved.estimated_total!==null&&saved.estimated_total!==undefined?' Estimated subtotal: '+money(saved.estimated_total,saved.currency)+'.':' The business must confirm final pricing.')+(trackingReady?' Use “Track request status” to check the latest status.':' Your request was saved, but a tracking link was not returned. Save the reference and contact the business for updates.');
    $('whatsappOrderBtn').hidden=!waHref(merchantData.whatsapp||merchantData.public_phone);
    $('copyRequestBtn').disabled=false;
    $('startAnotherBtn').hidden=false;
    toast('Request saved · '+saved.order_number);
  }catch(e){console.error(e);$('orderStatus').textContent='Could not save the request. '+(e.message||'Check the Stage 6 and Stage 7 database migrations and try again.');toast('Request was not saved.');}
  finally{submitting=false;if(!lastSubmittedOrder){$('submitOrderBtn').disabled=false;$('submitOrderBtn').textContent='Submit request to OneQR';}}
}
function openOrderPanel(){if(cartQuantity()===0){toast('Add a product or service first.');return;}$('orderPanel').hidden=false;renderCartLines();$('orderPanel').scrollIntoView({behavior:'smooth',block:'start'});$('customerName').focus({preventScroll:true})}
function changeQty(item,delta){const id=String(item.item_id),next=(cart.get(id)||0)+delta,limit=selectableLimit(item);if(next<=0)cart.delete(id);else if(next>limit){toast('Only '+limit+' unit(s) are available for this item.');return;}else cart.set(id,Math.min(99,next));updateDock();renderItems()}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}try{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();return ok}catch(e){return false}}
function showCatalog(merchant,items){merchantData=merchant;allItems=items;document.title=merchant.business_name+' catalogue & requests — OneQR';$('businessPageLink').href='merchant.html?slug='+encodeURIComponent(merchant.slug);const main=$('main');main.replaceChildren();const hero=el('section','hero');hero.appendChild(el('div','eyebrow',String(merchant.business_type||'local business').replace(/-/g,' ').toUpperCase()+' · CATALOGUE'));const identity=el('div');identity.appendChild(el('div','name',merchant.business_name));identity.appendChild(el('div','subtitle',merchant.tagline||'Browse products and services, then send a request directly to the business.'));hero.appendChild(identity);main.appendChild(hero);const row=el('div','headrow');row.append(el('h2','','Products & services'),el('span','count','0 items'));row.lastChild.id='visibleCount';main.appendChild(row);const filters=el('div','filters');[['all','All items'],['product','Products'],['service','Services']].forEach(([value,label])=>{const b=el('button','filter'+(value==='all'?' active':''),label);b.type='button';b.addEventListener('click',()=>{activeFilter=value;filters.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderItems()});filters.appendChild(b)});main.appendChild(filters);const grid=el('section','grid');grid.id='itemsGrid';main.appendChild(grid);

const nameField=el('div','field');const nameLabel=el('label','','Your name *');nameLabel.htmlFor='customerName';nameField.appendChild(nameLabel);const nameInput=el('input');nameInput.id='customerName';nameInput.name='customerName';nameInput.autocomplete='name';nameInput.maxLength=80;nameInput.required=true;nameInput.placeholder='Name to include in the message';nameField.appendChild(nameInput);
const phoneField=el('div','field');const phoneLabel=el('label','','Your contact number (optional)');phoneLabel.htmlFor='customerPhone';phoneField.appendChild(phoneLabel);const phoneInput=el('input');phoneInput.id='customerPhone';phoneInput.name='customerPhone';phoneInput.type='tel';phoneInput.autocomplete='tel';phoneInput.maxLength=30;phoneInput.placeholder='e.g. 077 123 4567';phoneField.appendChild(phoneInput);

const noteField=el('div','field full');const noteLabel=el('label','','Note for the business (optional)');noteLabel.htmlFor='customerNote';noteField.appendChild(noteLabel);const note=el('textarea');note.id='customerNote';note.name='customerNote';note.maxLength=400;note.placeholder='Quantity preference, preferred time, questions…';noteField.appendChild(note);formGrid.append(nameField,phoneField,fulfilField,noteField);
const consentField=el('div','field full');const consentLabel=el('label','consent');const consentInput=el('input');consentInput.type='checkbox';consentInput.id='customerConsent';consentInput.required=true;const consentText=el('span','','I agree to share the details above and this request with this business so it can respond to me.');consentLabel.append(consentInput,consentText);consentField.appendChild(consentLabel);formGrid.appendChild(consentField);order.appendChild(formGrid);
const submitRow=el('div','submit-row');

const send=el('button','btn ghost','Notify business on WhatsApp ↗');send.id='whatsappOrderBtn';send.type='button';send.hidden=true;send.addEventListener('click',()=>{try{if(!lastSubmittedOrder){toast('Submit the request first.');return}const href=waHref(merchantData.whatsapp||merchantData.public_phone,requestMessage(lastSubmittedOrder.order_number));if(!href){toast('No WhatsApp number is configured. You can copy the request message.');return}const popup=window.open(href,'_blank');if(!popup){toast('Your browser blocked the WhatsApp tab. Use Copy request message instead.');return}try{popup.opener=null}catch(ignore){}toast('WhatsApp opened. Review the message and press Send yourself.')}catch(e){toast(e.message||'Could not prepare the WhatsApp message.')}});submitRow.appendChild(send);
const copy=el('button','btn ghost','Copy request message');copy.id='copyRequestBtn';copy.type='button';copy.disabled=true;copy.addEventListener('click',async()=>{try{if(!lastSubmittedOrder){toast('Submit the request before copying its reference.');return}const ok=await copyText(requestMessage(lastSubmittedOrder.order_number));toast(ok?'Request and reference copied.':'Copy was blocked by your browser.')}catch(e){toast(e.message||'Could not prepare request.')}});submitRow.appendChild(copy);

order.appendChild(submitRow);const status=el('div','status');status.id='orderStatus';status.textContent='Your request will be stored securely so the business can review it in its OneQR Order Inbox. It will not be automatically confirmed.';order.appendChild(status);const fine=el('p','fineprint','Important: submitting saves a request for the business to review; it does not confirm an order. The business must confirm availability, final prices and fulfilment. OneQR does not take payment or reserve stock. By submitting, you agree to share the details you entered with this business.');order.appendChild(fine);main.appendChild(order);

async function init(){const cfg=window.ONEQR_CONFIG||{};if(!cfg.supabaseUrl||String(cfg.supabaseUrl).includes('YOUR_PROJECT_REF')||!cfg.supabaseAnonKey||String(cfg.supabaseAnonKey).includes('YOUR_SUPABASE')){showEmpty('OneQR is not connected yet','The website owner must configure the Supabase URL and publishable/anon key.');return}if(!window.supabase||typeof window.supabase.createClient!=='function'){showEmpty('Could not load the catalogue service','Check your internet connection and refresh the page.');return}const slug=(new URLSearchParams(location.search).get('slug')||'').trim().toLowerCase();if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){showEmpty('Catalogue not found','This link does not contain a valid business page address. Ask the merchant for an updated OneQR link.');return}client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const result=await client.from('public_merchants').select('slug,business_name,business_type,tagline,public_phone,whatsapp').eq('slug',slug).maybeSingle();if(result.error){console.error(result.error);showEmpty('Could not load this business','The public business view returned an error. Check the Supabase public view and API key configuration.');return}if(!result.data){showEmpty('This business page is not published','The business may still be a draft, or the link may be incorrect.');return}const products=await client.from('public_catalog_items').select('merchant_slug,item_type,name,description,price,currency,image_url,display_order,item_id,stock_tracking_enabled,stock_quantity').eq('merchant_slug',slug).order('display_order',{ascending:true});if(products.error){console.error(products.error);showEmpty('Catalogue database setup required','Check that the Stage 4 catalogue migration is installed, then refresh this page.');return}showCatalog(result.data,products.data||[])}
init().catch(err=>{console.error(err);showEmpty('Something went wrong','The catalogue could not be loaded. Please refresh and try again. '+(err.message||''))});
})();
